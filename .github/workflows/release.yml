# SPDX-License-Identifier: GPL-3.0-or-later
# Release pipeline (plan WP11).
#   1. Pushing a tag vX.Y.Z (or vX.Y.Z-pre.N) builds all three platforms into ONE draft release and checks
#      that every installer and update manifest is there. Nothing becomes public.
#   2. Publishing is a separate, manual run of this workflow ("Run workflow", tag + publish = true), after the
#      draft has been looked at. Pre-release versions (with a "-") are published as pre-releases.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft to publish (e.g. v0.1.0)'
        required: true
      publish:
        description: 'Publish the draft (type true)'
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag must equal package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Third-party notices are current
        run: npm ci --ignore-scripts && node scripts/third-party.mjs --check

  draft:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the single draft release (once, before the parallel builds)
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$state" != "true" ]; then echo "::error::release $TAG is already published"; exit 1; fi
            echo "draft $TAG exists; builds will add to it"
          else
            pre=""; if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then pre="--prerelease"; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
              --title "Mini Pose Master ${{ needs.check.outputs.version }}" \
              --notes "Draft built by the release workflow. Edit these notes before publishing."
          fi

  build:
    if: github.event_name == 'push'
    needs: [check, draft]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned until there is a Developer ID / code-signing cert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package and upload to the draft
        run: npx electron-builder --publish always

  verify:
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every installer and update manifest is in the draft
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$assets"
          missing=0
          for want in latest.yml latest-mac.yml latest-linux.yml \
                      "Mini-Pose-Master-Setup-$v.exe" "Mini-Pose-Master-Setup-$v.exe.blockmap" \
                      "Mini-Pose-Master-$v-arm64.dmg" "Mini-Pose-Master-$v-arm64-mac.zip" \
                      "Mini-Pose-Master-$v.AppImage"; do
            if ! grep -qxF "$want" <<< "$assets"; then echo "::error::missing asset $want"; missing=1; fi
          done
          drafts="$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft -q "[.[] | select(.tagName==\"$TAG\")] | length")"
          if [ "$drafts" != "1" ]; then echo "::error::expected one release for $TAG, found $drafts"; missing=1; fi
          exit $missing

  publish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        shell: bash
        run: |
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
          if [ "$state" != "true" ]; then echo "::error::$TAG is not a draft"; exit 1; fi
          for want in latest.yml latest-mac.yml latest-linux.yml; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$want" \
              || { echo "::error::draft has no $want; rerun the tag build first"; exit 1; }
          done
          pre="--prerelease=false"; if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then pre="--prerelease"; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false $pre
