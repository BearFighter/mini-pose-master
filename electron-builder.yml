appId: com.bearfighter.miniposemaster
productName: Mini Pose Master
directories:
  output: release
files:
  - out/**
extraResources:
  - from: engine
    to: engine
  - from: resources
    to: resources
  - from: THIRD_PARTY.md
    to: THIRD_PARTY.md
  - from: LICENSE
    to: LICENSE
asar: true
fileAssociations:
  - ext: mposer
    name: Mini Pose Master Project
    role: Editor
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Mini-Pose-Master-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  artifactName: Mini-Pose-Master-${version}-${arch}.${ext}
mac:
  artifactName: Mini-Pose-Master-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.graphics-design
appImage:
  artifactName: Mini-Pose-Master-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Graphics
publish:
  - provider: github
    owner: BearFighter
    repo: mini-pose-master
    releaseType: draft
